<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">午后窗边翻看相册</title>
  <desc id="desc">暖色日光落在桌面、旧相册和两双翻阅照片的手上。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8c9b2"/>
      <stop offset="1" stop-color="#998c78"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#fff9e8" stop-opacity=".96"/>
      <stop offset="1" stop-color="#ead6ae" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d5947"/>
      <stop offset="1" stop-color="#4d3931"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="8" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
