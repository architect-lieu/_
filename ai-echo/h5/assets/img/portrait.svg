<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Photographer self-portrait">
  <defs>
    <radialGradient id="pbg" cx="0.4" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#dadada"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#pbg)"/>
  <!-- camera held to face -->
  <g>
    <!-- shoulders -->
    <path d="M120 1000 Q160 760 280 700 L520 700 Q640 760 680 1000 Z" fill="#0a0a0a"/>
    <!-- neck/jaw partly visible -->
    <ellipse cx="400" cy="700" rx="140" ry="160" fill="#bababa"/>
    <!-- camera covering eyes -->
    <rect x="240" y="500" width="320" height="180" rx="14" fill="#1a1a1a"/>
    <circle cx="400" cy="590" r="60" fill="#3a3a3a"/>
    <circle cx="400" cy="590" r="44" fill="#0a0a0a"/>
    <circle cx="400" cy="590" r="20" fill="#1a1a1a"/>
    <!-- camera details -->
    <rect x="540" y="520" width="20" height="40" fill="#3a3a3a"/>
    <rect x="280" y="500" width="60" height="14" fill="#3a3a3a"/>
    <!-- hair on top -->
    <path d="M260 500 Q260 380 400 360 Q540 380 540 500 Q540 420 400 400 Q260 420 260 500 Z" fill="#0a0a0a"/>
    <!-- mouth visible below camera -->
    <path d="M380 720 Q400 730 420 720" stroke="#5a5a5a" stroke-width="3" fill="none"/>
    <!-- hands holding camera -->
    <path d="M210 600 Q200 540 240 520 L280 540 L260 600 Z" fill="#bababa"/>
    <path d="M590 600 Q600 540 560 520 L520 540 L540 600 Z" fill="#bababa"/>
  </g>
</svg>
