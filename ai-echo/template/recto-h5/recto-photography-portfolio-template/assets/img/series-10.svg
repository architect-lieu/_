<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Open book with reading glasses on linen">
  <defs>
    <radialGradient id="sa" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#dcdcdc"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#sa)"/>
  <!-- book -->
  <g>
    <rect x="200" y="600" width="800" height="600" fill="#fafafa"/>
    <rect x="200" y="600" width="400" height="600" fill="#f0f0f0"/>
    <line x1="600" y1="600" x2="600" y2="1200" stroke="#5a5a5a" stroke-width="4"/>
    <!-- text lines -->
    <g stroke="#3a3a3a" stroke-width="2" fill="none" opacity="0.6">
      <line x1="240" y1="700" x2="560" y2="700"/>
      <line x1="240" y1="730" x2="560" y2="730"/>
      <line x1="240" y1="760" x2="540" y2="760"/>
      <line x1="240" y1="790" x2="560" y2="790"/>
      <line x1="240" y1="820" x2="540" y2="820"/>
      <line x1="240" y1="850" x2="500" y2="850"/>
      <line x1="240" y1="900" x2="560" y2="900"/>
      <line x1="240" y1="930" x2="540" y2="930"/>
      <line x1="240" y1="960" x2="540" y2="960"/>
      <line x1="240" y1="990" x2="560" y2="990"/>
      <line x1="240" y1="1020" x2="500" y2="1020"/>
      <line x1="240" y1="1080" x2="540" y2="1080"/>
      <line x1="240" y1="1110" x2="560" y2="1110"/>
      <line x1="640" y1="700" x2="960" y2="700"/>
      <line x1="640" y1="730" x2="960" y2="730"/>
      <line x1="640" y1="760" x2="940" y2="760"/>
      <line x1="640" y1="790" x2="960" y2="790"/>
      <line x1="640" y1="820" x2="940" y2="820"/>
    </g>
    <!-- drop cap suggestion -->
    <rect x="240" y="700" width="40" height="56" fill="#0a0a0a" opacity="0.85"/>
    <rect x="640" y="700" width="40" height="56" fill="#0a0a0a" opacity="0.85"/>
  </g>
  <!-- reading glasses -->
  <g fill="none" stroke="#0a0a0a" stroke-width="6">
    <ellipse cx="780" cy="1320" rx="60" ry="40"/>
    <ellipse cx="940" cy="1320" rx="60" ry="40"/>
    <line x1="838" y1="1320" x2="882" y2="1320"/>
  </g>
  <!-- shadow under book -->
  <ellipse cx="600" cy="1230" rx="500" ry="20" fill="#0a0a0a" opacity="0.4"/>
</svg>
