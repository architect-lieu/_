<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="City rooftops at first morning fog">
  <defs>
    <linearGradient id="sd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e6e6"/>
      <stop offset="0.5" stop-color="#bababa"/>
      <stop offset="1" stop-color="#7a7a7a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#sd)"/>
  <!-- fog band -->
  <rect y="700" width="1200" height="200" fill="#dadada" opacity="0.8"/>
  <!-- distant building cluster -->
  <g fill="#5a5a5a">
    <rect x="40" y="780" width="120" height="240"/>
    <rect x="180" y="800" width="100" height="220"/>
    <rect x="300" y="760" width="140" height="260"/>
    <rect x="460" y="820" width="100" height="200"/>
    <rect x="580" y="780" width="120" height="240"/>
    <rect x="720" y="800" width="100" height="220"/>
    <rect x="840" y="760" width="140" height="260"/>
    <rect x="1000" y="820" width="100" height="200"/>
    <rect x="1120" y="780" width="80" height="240"/>
  </g>
  <!-- closer rooftops -->
  <g fill="#1a1a1a">
    <rect x="0" y="1020" width="140" height="480"/>
    <rect x="160" y="1080" width="160" height="420"/>
    <rect x="340" y="1040" width="180" height="460"/>
    <rect x="540" y="1120" width="120" height="380"/>
    <rect x="680" y="1060" width="200" height="440"/>
    <rect x="900" y="1100" width="160" height="400"/>
    <rect x="1080" y="1040" width="120" height="460"/>
  </g>
  <!-- chimney details -->
  <g fill="#0a0a0a">
    <rect x="60" y="980" width="20" height="44"/>
    <rect x="380" y="1000" width="20" height="44"/>
    <rect x="720" y="1020" width="24" height="48"/>
    <rect x="1100" y="1000" width="20" height="44"/>
  </g>
  <!-- subtle smoke -->
  <g fill="#fafafa" opacity="0.55">
    <ellipse cx="70" cy="950" rx="50" ry="20"/>
    <ellipse cx="730" cy="980" rx="60" ry="26"/>
  </g>
</svg>
