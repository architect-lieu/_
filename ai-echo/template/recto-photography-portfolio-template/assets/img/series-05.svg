<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Architectural facade — concrete and shadow">
  <defs>
    <linearGradient id="s5bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6e6e6"/>
      <stop offset="0.5" stop-color="#a4a4a4"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#s5bg)"/>
  <!-- main facade -->
  <rect x="0" y="0" width="900" height="1500" fill="#cfcfcf"/>
  <rect x="900" y="0" width="300" height="1500" fill="#1a1a1a"/>
  <!-- repeating windows -->
  <g fill="#0a0a0a">
    <rect x="80" y="160" width="120" height="200"/>
    <rect x="280" y="160" width="120" height="200"/>
    <rect x="480" y="160" width="120" height="200"/>
    <rect x="680" y="160" width="120" height="200"/>
    <rect x="80" y="460" width="120" height="200"/>
    <rect x="280" y="460" width="120" height="200"/>
    <rect x="480" y="460" width="120" height="200"/>
    <rect x="680" y="460" width="120" height="200"/>
    <rect x="80" y="760" width="120" height="200"/>
    <rect x="280" y="760" width="120" height="200"/>
    <rect x="480" y="760" width="120" height="200"/>
    <rect x="680" y="760" width="120" height="200"/>
    <rect x="80" y="1060" width="120" height="200"/>
    <rect x="280" y="1060" width="120" height="200"/>
    <rect x="480" y="1060" width="120" height="200"/>
    <rect x="680" y="1060" width="120" height="200"/>
  </g>
  <!-- cast shadow on lower facade -->
  <polygon points="0,1300 900,1300 900,1500 0,1500" fill="#3a3a3a" opacity="0.55"/>
  <polygon points="0,1140 600,1300 0,1300" fill="#1a1a1a" opacity="0.5"/>
</svg>
