<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mountain ridge at first light">
  <defs>
    <linearGradient id="s9sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7a7a"/>
      <stop offset="0.7" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#s9sky)"/>
  <!-- distant ridges, lightest in back -->
  <path d="M0 800 L160 720 L380 760 L580 700 L780 740 L1000 720 L1200 740 L1200 820 L0 820 Z" fill="#a0a0a0"/>
  <path d="M0 900 L200 820 L420 860 L640 800 L840 840 L1040 820 L1200 840 L1200 920 L0 920 Z" fill="#5a5a5a"/>
  <path d="M0 1040 L240 940 L460 980 L660 920 L880 960 L1080 940 L1200 960 L1200 1080 L0 1080 Z" fill="#2a2a2a"/>
  <path d="M0 1180 L280 1080 L520 1120 L740 1060 L960 1100 L1200 1080 L1200 1500 L0 1500 Z" fill="#0a0a0a"/>
  <!-- single bright cloud -->
  <ellipse cx="800" cy="500" rx="200" ry="40" fill="#fafafa" opacity="0.85"/>
  <ellipse cx="780" cy="520" rx="160" ry="30" fill="#fafafa" opacity="0.6"/>
</svg>
