<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Still life — ceramic vessel and morning light">
  <defs>
    <radialGradient id="s6bg" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f0f0f0"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#s6bg)"/>
  <!-- table edge -->
  <rect y="900" width="1200" height="600" fill="#0e0e0e"/>
  <!-- cast shadow on table -->
  <ellipse cx="600" cy="1100" rx="320" ry="40" fill="#000000" opacity="0.7"/>
  <!-- ceramic vessel -->
  <path d="M400 1100 Q380 800 540 720 Q700 800 680 1100 Z" fill="#cfcfcf"/>
  <ellipse cx="540" cy="710" rx="80" ry="14" fill="#7a7a7a"/>
  <ellipse cx="540" cy="708" rx="76" ry="10" fill="#0a0a0a"/>
  <!-- vessel highlight -->
  <path d="M420 1080 Q420 820 540 760" stroke="#fafafa" stroke-width="14" fill="none" opacity="0.6"/>
  <!-- side darkening -->
  <path d="M600 700 Q700 840 670 1080" stroke="#3a3a3a" stroke-width="80" fill="none" opacity="0.35"/>
  <!-- single branch -->
  <path d="M540 720 Q480 580 380 460 Q360 410 350 360" stroke="#1a1a1a" stroke-width="3" fill="none"/>
  <!-- leaves -->
  <ellipse cx="430" cy="540" rx="36" ry="14" fill="#1a1a1a" transform="rotate(-30 430 540)"/>
  <ellipse cx="395" cy="470" rx="32" ry="12" fill="#1a1a1a" transform="rotate(-50 395 470)"/>
  <ellipse cx="365" cy="405" rx="30" ry="10" fill="#1a1a1a" transform="rotate(-65 365 405)"/>
  <!-- second small object -->
  <rect x="780" y="1040" width="60" height="60" fill="#5a5a5a"/>
  <rect x="780" y="1040" width="60" height="60" fill="none" stroke="#0a0a0a" stroke-width="2"/>
</svg>
